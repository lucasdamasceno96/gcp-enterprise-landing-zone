name: "GCP Landing Zone Deploy"

on:
  push:
    branches: ["main"]
    paths: ["terraform/**"]
  pull_request:
    branches: ["main"]

# Prevents multiple runs from clashing, but job dependencies handle the order
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------------
  # JOB 1: NETWORK (The Foundation)
  # --------------------------------------------------------------------------------
  network:
    name: "Foundation: Network"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/network

      - name: Terraform Plan
        run: terraform plan -var="project_id=${{ vars.GCP_PROJECT_ID }}" -no-color
        working-directory: ./terraform/network

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -var="project_id=${{ vars.GCP_PROJECT_ID }}" -auto-approve
        working-directory: ./terraform/network

  # --------------------------------------------------------------------------------
  # JOB 2: SECURITY (The Vault)
  # Depends on Network to ensure sequential state access
  # --------------------------------------------------------------------------------
  security:
    name: "Security Layer"
    needs: network
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/security

      - name: Terraform Plan
        run: terraform plan -var="project_id=${{ vars.GCP_PROJECT_ID }}" -no-color
        working-directory: ./terraform/security

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -var="project_id=${{ vars.GCP_PROJECT_ID }}" -auto-approve
        working-directory: ./terraform/security

  # --------------------------------------------------------------------------------
  # JOB 3: WORKLOADS (The Application)
  # Depends on Security to ensure Artifact Registry and IAM are ready
  # --------------------------------------------------------------------------------
  workloads:
    name: "Workload Layer"
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/workloads

      - name: Terraform Plan
        run: terraform plan -var="project_id=${{ vars.GCP_PROJECT_ID }}" -no-color
        working-directory: ./terraform/workloads

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -var="project_id=${{ vars.GCP_PROJECT_ID }}" -auto-approve
        working-directory: ./terraform/workloads

  # --------------------------------------------------------------------------------
  # JOB 4: OBSERVABILITY (The Eyes)
  # Final step: Monitoring dashboards and uptime checks
  # --------------------------------------------------------------------------------
  observability:
    name: "Monitoring Layer"
    needs: workloads
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/observability

      - name: Terraform Plan
        run: terraform plan -var="project_id=${{ vars.GCP_PROJECT_ID }}" -no-color
        working-directory: ./terraform/observability

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -var="project_id=${{ vars.GCP_PROJECT_ID }}" -auto-approve
        working-directory: ./terraform/observability
name: "GCP Landing Zone Deploy"

on:
  push:
    branches: ["main"]
    paths: ["terraform/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    name: "Terraform Build"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        directory: [network, workloads]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/${{ matrix.directory }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -var="project_id=${{ vars.GCP_PROJECT_ID }}" -no-color
        working-directory: ./terraform/${{ matrix.directory }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -var="project_id=${{ vars.GCP_PROJECT_ID }}" -auto-approve
        working-directory: ./terraform/${{ matrix.directory }}
